<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Catálogo</title>
  <meta name="description" content="Mirá el catálogo y hacé tu pedido online." />
  <meta name="theme-color" content="#2E7D32" />
  <style>
    :root {
      --primary: #2e7d32;
      --primary-soft: #e8f3e9;
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #c62828;
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #5fb865;
        --primary-soft: #1d2e1f;
        --bg: #111315;
        --card: #1a1d20;
        --text: #eef0f2;
        --muted: #9aa1ab;
        --border: #2a2e33;
        --danger: #ef6b6b;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding-bottom: 96px;
    }
    button { font: inherit; cursor: pointer; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }

    header { padding: 28px 0 12px; }
    header h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.02em; }
    header p { margin: 0; color: var(--muted); }

    .search {
      width: 100%; margin: 16px 0; padding: 12px 14px; font-size: 16px;
      border: 1px solid var(--border); border-radius: 12px;
      background: var(--card); color: var(--text);
    }
    .search:focus { outline: 2px solid var(--primary); outline-offset: -1px; }

    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .card.out { opacity: 0.55; }
    .thumb {
      aspect-ratio: 1; width: 100%; object-fit: cover; display: block;
      background: var(--primary-soft);
    }
    .thumb.placeholder {
      display: flex; align-items: center; justify-content: center;
      font-size: 42px; font-weight: 700; color: var(--primary);
    }
    .info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .name { font-weight: 600; font-size: 15px; line-height: 1.25; }
    .desc { color: var(--muted); font-size: 13px; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .price { font-weight: 700; font-size: 16px; margin-top: auto; padding-top: 6px; }
    .actions { padding: 0 12px 12px; }
    .add {
      width: 100%; padding: 9px; border-radius: 10px; border: 0;
      background: var(--primary); color: #fff; font-weight: 600;
    }
    .add:disabled { background: var(--border); color: var(--muted); cursor: default; }
    .stepper { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .stepper button {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--primary); background: transparent; color: var(--primary);
      font-size: 18px; font-weight: 700;
    }
    .stepper span { font-weight: 700; }

    .state { text-align: center; padding: 64px 16px; color: var(--muted); }
    .state strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }

    .cartbar {
      position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, var(--bg) 30%);
    }
    .cartbar button {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; max-width: 560px; margin: 0 auto; padding: 15px 18px;
      border: 0; border-radius: 14px; background: var(--primary); color: #fff;
      font-weight: 700; font-size: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.18);
    }

    dialog {
      width: min(560px, 100%); max-height: 90vh; margin: auto auto 0; padding: 0;
      border: 0; border-radius: 18px 18px 0 0; background: var(--card); color: var(--text);
    }
    @media (min-width: 600px) { dialog { margin: auto; border-radius: 18px; } }
    dialog::backdrop { background: rgba(0,0,0,.45); }
    .sheet { padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
    .sheet h2 { margin: 0; font-size: 20px; }
    .line { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .line .stepper { min-width: 120px; }
    .total { font-size: 18px; font-weight: 700; border-top: 1px solid var(--border); padding-top: 12px; }
    .sheet label { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
    .sheet input, .sheet textarea {
      padding: 11px 12px; font-size: 16px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit;
    }
    .primary { padding: 14px; border: 0; border-radius: 12px; background: var(--primary); color: #fff; font-weight: 700; font-size: 16px; }
    .primary:disabled { opacity: .6; cursor: default; }
    .whatsapp { padding: 13px; border: 0; border-radius: 12px; background: #25d366; color: #fff; font-weight: 700; font-size: 15px; }
    .check { width: 64px; height: 64px; margin: 8px auto 0; border-radius: 50%; background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700; }
    .done-text { text-align: center; color: var(--muted); margin: 0; line-height: 1.45; }
    .ghost { padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: transparent; color: var(--text); }
    .error { color: var(--danger); font-size: 14px; margin: 0; }

    footer { text-align: center; color: var(--muted); font-size: 13px; padding: 32px 0 8px; }
    footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="store-name">Cargando…</h1>
      <p id="store-sub"></p>
    </header>
    <input id="search" class="search" type="search" placeholder="Buscar producto" hidden />
    <main id="content"><div class="state">Cargando catálogo…</div></main>
    <footer id="footer" hidden></footer>
  </div>

  <div class="cartbar" id="cartbar" hidden>
    <button id="open-cart" type="button"><span id="cart-count"></span><span id="cart-total"></span></button>
  </div>

  <dialog id="cart">
    <form class="sheet" method="dialog" id="cart-form">
      <h2>Tu pedido</h2>
      <div id="cart-lines"></div>
      <div class="line total"><span>Total</span><span id="cart-sum"></span></div>
      <label>Tu nombre <input id="customer" autocomplete="name" maxlength="80" required /></label>
      <label>Tu WhatsApp <input id="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="Ej: 11 2233 4455" required /></label>
      <label>Aclaraciones (opcional) <textarea id="note" rows="2" maxlength="500" placeholder="Envío, retiro, forma de pago…"></textarea></label>
      <p class="error" id="cart-error" hidden></p>
      <button class="primary" type="submit" id="confirm">Confirmar pedido</button>
      <button class="whatsapp" type="button" id="send-wa" hidden>Enviar por WhatsApp</button>
      <button class="ghost" type="button" id="close-cart">Seguir comprando</button>
    </form>
    <div class="sheet" id="done" hidden>
      <div class="check" aria-hidden="true">✓</div>
      <h2 style="text-align:center">¡Pedido enviado!</h2>
      <p class="done-text" id="done-text"></p>
      <button class="whatsapp" type="button" id="done-wa" hidden>Escribirle por WhatsApp</button>
      <button class="ghost" type="button" id="done-close">Listo</button>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script>
    (function () {
      var cfg = window.VENDE_CONFIG || {};
      var params = new URLSearchParams(location.search);
      var slug = (params.get('t') || location.hash.slice(1) || '').toLowerCase();

      var $ = function (id) { return document.getElementById(id); };
      var money = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 });

      var store = null;
      var cart = {}; // product_id -> cantidad
      var storageKey = 'vende-cart-' + slug;

      function loadCart() {
        try { cart = JSON.parse(localStorage.getItem(storageKey)) || {}; } catch (e) { cart = {}; }
      }
      function saveCart() {
        try { localStorage.setItem(storageKey, JSON.stringify(cart)); } catch (e) { /* sin storage */ }
      }

      // Crea elementos sin innerHTML para no inyectar HTML de los datos.
      function el(tag, attrs, children) {
        var node = document.createElement(tag);
        Object.keys(attrs || {}).forEach(function (k) {
          if (k === 'text') node.textContent = attrs[k];
          else if (k === 'onclick') node.addEventListener('click', attrs[k]);
          else node.setAttribute(k, attrs[k]);
        });
        (children || []).forEach(function (c) { if (c) node.appendChild(c); });
        return node;
      }

      function showState(title, text) {
        $('content').replaceChildren(el('div', { class: 'state' }, [el('strong', { text: title }), el('span', { text: text || '' })]));
      }

      function productById(id) {
        return store.products.find(function (p) { return p.id === id; });
      }

      function cartItems() {
        return Object.keys(cart)
          .map(function (id) { return { product: productById(id), qty: cart[id] }; })
          .filter(function (i) { return i.product && i.product.in_stock && i.qty > 0; });
      }

      function setQty(id, qty) {
        if (qty <= 0) delete cart[id]; else cart[id] = qty;
        saveCart();
        render();
      }

      function stepper(id, qty) {
        return el('div', { class: 'stepper' }, [
          el('button', { type: 'button', 'aria-label': 'Quitar uno', text: '−', onclick: function () { setQty(id, qty - 1); } }),
          el('span', { text: String(qty) }),
          el('button', { type: 'button', 'aria-label': 'Agregar uno', text: '+', onclick: function () { setQty(id, qty + 1); } }),
        ]);
      }

      function productCard(p) {
        var qty = cart[p.id] || 0;
        var thumb = p.image_url
          ? el('img', { class: 'thumb', src: p.image_url, alt: p.name, loading: 'lazy' })
          : el('div', { class: 'thumb placeholder', text: p.name.charAt(0).toUpperCase() });
        var action = !p.in_stock
          ? el('button', { class: 'add', type: 'button', disabled: '', text: 'Sin stock' })
          : qty > 0
            ? stepper(p.id, qty)
            : el('button', { class: 'add', type: 'button', text: 'Agregar', onclick: function () { setQty(p.id, 1); } });

        return el('article', { class: 'card' + (p.in_stock ? '' : ' out') }, [
          thumb,
          el('div', { class: 'info' }, [
            el('div', { class: 'name', text: p.name }),
            p.description ? el('div', { class: 'desc', text: p.description }) : null,
            el('div', { class: 'price', text: money.format(p.price) }),
          ]),
          el('div', { class: 'actions' }, [action]),
        ]);
      }

      function render() {
        var q = $('search').value.trim().toLowerCase();
        var list = store.products.filter(function (p) { return !q || p.name.toLowerCase().indexOf(q) !== -1; });

        if (!store.products.length) showState('Todavía no hay productos', 'Volvé a pasar pronto.');
        else if (!list.length) showState('Sin resultados', 'Probá con otra búsqueda.');
        else $('content').replaceChildren(el('div', { class: 'grid' }, list.map(productCard)));

        var items = cartItems();
        var count = items.reduce(function (s, i) { return s + i.qty; }, 0);
        var total = items.reduce(function (s, i) { return s + i.qty * i.product.price; }, 0);
        $('cartbar').hidden = count === 0;
        $('cart-count').textContent = 'Ver pedido (' + count + ')';
        $('cart-total').textContent = money.format(total);
        if ($('cart').open) renderCart();
      }

      function renderCart() {
        var items = cartItems();
        $('confirm').disabled = items.length === 0;
        if (!items.length) {
          $('cart-lines').replaceChildren(el('p', { class: 'desc', text: 'No hay productos en tu pedido.' }));
          $('cart-sum').textContent = money.format(0);
          return;
        }
        $('cart-lines').replaceChildren.apply($('cart-lines'), items.map(function (i) {
          return el('div', { class: 'line', style: 'padding: 6px 0' }, [
            el('div', {}, [
              el('div', { class: 'name', text: i.product.name }),
              el('div', { class: 'desc', text: money.format(i.product.price * i.qty) }),
            ]),
            stepper(i.product.id, i.qty),
          ]);
        }));
        $('cart-sum').textContent = money.format(items.reduce(function (s, i) { return s + i.qty * i.product.price; }, 0));
      }

      // Las claves nuevas (sb_publishable_…) van sólo en "apikey"; las viejas (JWT) también en Authorization.
      function rpcHeaders() {
        var h = { 'Content-Type': 'application/json', apikey: cfg.supabaseAnonKey };
        if (/^eyJ/.test(cfg.supabaseAnonKey)) h.Authorization = 'Bearer ' + cfg.supabaseAnonKey;
        return h;
      }

      function rpc(fn, body) {
        return fetch(cfg.supabaseUrl + '/rest/v1/rpc/' + fn, {
          method: 'POST',
          headers: rpcHeaders(),
          body: JSON.stringify(body),
        });
      }

      function orderSummary(items) {
        return items.map(function (i) { return '• ' + i.qty + ' x ' + i.product.name + ' (' + money.format(i.product.price * i.qty) + ')'; }).join('\n');
      }

      function openWhatsapp(text) {
        window.open('https://wa.me/' + store.whatsapp.replace(/\D/g, '') + '?text=' + encodeURIComponent(text), '_blank');
      }

      // Traduce los errores de place_web_order a mensajes para el cliente.
      function errorMessage(err) {
        var msg = (err && err.message) || '';
        if (msg === 'OUT_OF_STOCK') return 'No queda stock suficiente de "' + err.hint + '". Actualizamos el catálogo, revisá tu pedido.';
        if (msg === 'RATE_LIMIT') return 'Hiciste muchos pedidos seguidos. Esperá un rato o escribile a la tienda.';
        if (msg === 'LIMIT_ORDERS') return 'La tienda no puede recibir pedidos online en este momento.';
        if (msg === 'INVALID_ORDER' && err.hint) return err.hint + '.';
        return 'No pudimos enviar el pedido. Probá de nuevo.';
      }

      function showError(text) {
        var box = $('cart-error');
        box.textContent = text;
        box.hidden = false;
        // Si el pedido online falla, queda WhatsApp como alternativa.
        $('send-wa').hidden = !store.whatsapp;
      }

      async function refreshCatalog() {
        try {
          var res = await rpc('public_catalog', { p_slug: slug });
          if (res.ok) { var fresh = await res.json(); if (fresh) store = fresh; }
        } catch (e) { /* seguimos con los datos que había */ }
      }

      async function confirmOrder(e) {
        e.preventDefault();
        var name = $('customer').value.trim();
        var phone = $('phone').value.replace(/\D/g, '');
        var note = $('note').value.trim();
        $('cart-error').hidden = true;
        $('send-wa').hidden = true;

        if (name.length < 2) return showError('Poné tu nombre así la tienda sabe quién sos.');
        if (phone.length < 8 || phone.length > 15) return showError('Revisá tu número de WhatsApp (con código de área).');

        var items = cartItems();
        $('confirm').disabled = true;
        $('confirm').textContent = 'Enviando…';
        try {
          var res = await rpc('place_web_order', {
            p_slug: slug,
            p_customer_name: name,
            p_customer_phone: phone,
            p_notes: note || null,
            p_items: items.map(function (i) { return { product_id: i.product.id, quantity: i.qty }; }),
          });
          var data = await res.json().catch(function () { return null; });
          if (!res.ok) {
            if (data && data.message === 'OUT_OF_STOCK') { await refreshCatalog(); render(); }
            showError(errorMessage(data));
            return;
          }

          var code = String(data.id).slice(0, 6).toUpperCase();
          var summary = orderSummary(items);
          $('done-text').textContent = 'Pedido #' + code + ' por ' + money.format(data.total) + '. ' +
            store.name + ' lo recibió y te va a contactar al ' + $('phone').value.trim() + '.';
          $('done-wa').hidden = !store.whatsapp;
          $('done-wa').onclick = function () {
            openWhatsapp('¡Hola ' + store.name + '! Soy ' + name + ', te acabo de hacer el pedido #' + code + ':\n\n' + summary);
          };
          $('cart-form').hidden = true;
          $('done').hidden = false;

          cart = {};
          saveCart();
          await refreshCatalog();
          render();
        } catch (err) {
          showError('No pudimos conectarnos. Revisá tu conexión y probá de nuevo.');
        } finally {
          $('confirm').disabled = cartItems().length === 0;
          $('confirm').textContent = 'Confirmar pedido';
        }
      }

      function sendByWhatsapp() {
        var items = cartItems();
        var name = $('customer').value.trim();
        var note = $('note').value.trim();
        var total = items.reduce(function (s, i) { return s + i.qty * i.product.price; }, 0);
        openWhatsapp('¡Hola ' + store.name + '! ' + (name ? 'Soy ' + name + ' y q' : 'Q') + 'uiero hacer este pedido:\n\n' +
          orderSummary(items) + '\n\nTotal: ' + money.format(total) + (note ? '\n\nAclaraciones: ' + note : ''));
      }

      function closeCart() {
        $('cart').close();
      }

      async function init() {
        if (!slug) { $('store-name').textContent = 'Catálogo'; showState('Falta el link de la tienda', 'Abrí el link que te pasó el vendedor.'); return; }
        try {
          var res = await rpc('public_catalog', { p_slug: slug });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          store = await res.json();
        } catch (e) {
          $('store-name').textContent = 'Catálogo';
          showState('No pudimos cargar el catálogo', 'Revisá tu conexión y probá de nuevo.');
          return;
        }

        if (!store) { $('store-name').textContent = 'Catálogo'; showState('Tienda no encontrada', 'Revisá que el link esté bien escrito.'); return; }

        document.title = store.name;
        $('store-name').textContent = store.name;
        $('store-sub').textContent = 'Elegí tus productos y hacé tu pedido online.';
        $('search').hidden = store.products.length < 6;

        if (store.branding) {
          $('footer').replaceChildren(
            document.createTextNode('Catálogo creado con '),
            el('a', { href: cfg.appUrl || '#', target: '_blank', rel: 'noopener', text: 'Vendé' }),
            document.createTextNode(' · Creá el tuyo gratis')
          );
          $('footer').hidden = false;
        }

        loadCart();
        render();
      }

      $('search').addEventListener('input', render);
      $('open-cart').addEventListener('click', function () {
        $('cart-form').hidden = false;
        $('done').hidden = true;
        $('cart-error').hidden = true;
        $('send-wa').hidden = true;
        renderCart();
        $('cart').showModal();
      });
      $('close-cart').addEventListener('click', closeCart);
      $('done-close').addEventListener('click', closeCart);
      $('send-wa').addEventListener('click', sendByWhatsapp);
      $('cart-form').addEventListener('submit', confirmOrder);

      init();
    })();
  </script>
</body>
</html>
